version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dealsmap
      POSTGRES_USER: deals_user
      POSTGRES_PASSWORD: UnMotDePasseSolide123!
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./DealsMap
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./DealsMap:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=1
      - DB_NAME=dealsmap
      - DB_USER=deals_user
      - DB_PASSWORD=UnMotDePasseSolide123!
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  pgdata:
